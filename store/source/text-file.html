<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 1fr 660px; align-items: center;
    background: linear-gradient(135deg, #eef0ff 0%, #f7f6fb 55%, #fdfdfb 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; color: #1c1c1a;
  }
  .text { padding: 0 30px 0 72px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; margin-bottom: 44px; }
  .brand img { width: 44px; height: 44px; }
  h1 { font-size: 48px; line-height: 1.1; margin: 0 0 20px; letter-spacing: -0.02em; text-wrap: balance; }
  p { font-size: 23px; line-height: 1.45; color: #5d5b54; margin: 0; max-width: 520px; }
  .shot { display: flex; justify-content: center; padding-right: 40px; }
  .shot img {
    height: 640px; border-radius: 10px; border: 1px solid #e2e0d8;
    box-shadow: 0 30px 60px -30px rgba(67, 56, 202, 0.45), 0 8px 20px -12px rgba(28, 28, 26, 0.25);
  }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../icons/icon.svg" alt=""> Simple Transcript</div>
    <h1>Copy it, or save it as plain text</h1>
    <p>The meeting, its date and attendees, then the conversation. A file that opens anywhere and pastes cleanly.</p>
  </div>
  <div class="shot"><img src="capture-text-file.png" alt=""></div>
</body>
</html>
