<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    [hidden] { display: none !important; }

    /* The palette, the same table the panel carries, so the two
       surfaces of one extension cannot drift apart. */
    :root {
      --bg: #fdfdfb;
      --bg-sunken: #f6f5f1;
      --bg-raised: #fffffd;
      --bg-hover: rgba(28, 28, 26, 0.05);
      --bg-active: rgba(176, 86, 58, 0.12);
      --border: #e2e0d8;
      --border-strong: #cfccc0;
      --text: #1c1c1a;
      --text-dim: #6f6d65;
      --text-faint: #8b8981;
      --accent: #b0563a;
      --accent-text: #fff;
      --warning-bg: #f6ecd8;
      --warning-border: #e0cb96;
      --warning-text: #6b5312;
      --danger: #a83a2a;
      --comment: rgba(176, 86, 58, 0.18);
      --comment-strong: rgba(176, 86, 58, 0.38);
      --shadow: 0 1px 2px rgba(28, 28, 26, 0.05), 0 8px 24px -14px rgba(28, 28, 26, 0.28);
      --font-ui: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      --font-code: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --radius: 6px;
      --quick: 120ms;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-sunken: #171715;
        --bg-raised: #22221f;
        --bg-hover: rgba(242, 241, 236, 0.06);
        --bg-active: rgba(210, 121, 90, 0.18);
        --border: #383833;
        --border-strong: #4c4c45;
        --text: #f2f1ec;
        --text-dim: #a3a199;
        --text-faint: #7d7b73;
        --accent: #d2795a;
        --accent-text: #1c1c1a;
        --warning-bg: #3a3222;
        --warning-border: #5c4f2e;
        --warning-text: #e3cb96;
        --danger: #e08476;
        --comment: rgba(210, 121, 90, 0.2);
        --comment-strong: rgba(210, 121, 90, 0.42);
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
      }
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 340px;
      min-height: 300px;
      max-height: 560px;
      overflow: hidden;
      font-family: var(--font-ui);
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg-raised);
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .btn-back {
      padding: 2px 4px;
      font-size: 12px;
      color: var(--text-dim);
      border-radius: 4px;
      transition: color var(--quick) var(--ease), background-color var(--quick) var(--ease);
    }

    .btn-back:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .header-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 13px;
      color: var(--text-dim);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease), color var(--quick) var(--ease);
    }

    .btn-icon:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .content {
      flex: 1;
      padding: 6px;
      overflow-y: auto;
    }

    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    /* Meeting list items */
    .meeting-item {
      margin-bottom: 2px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color var(--quick) var(--ease);
    }

    .meeting-item:hover { background: var(--bg-hover); }
    .meeting-item.current { background: var(--bg-active); }

    .meeting-item-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meeting-item-title {
      flex: 1;
      min-width: 0;
      padding: 1px 3px;
      margin: -1px -3px;
      overflow: hidden;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      text-overflow: ellipsis;
      border-radius: 3px;
      outline: none;
    }

    .meeting-item-title[contenteditable="true"] {
      white-space: normal;
      background: var(--bg-sunken);
      outline: 1px solid var(--accent);
    }

    .live-badge {
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      overflow: hidden;
      font-size: 0;
      color: transparent;
      background: var(--accent);
      border-radius: 50%;
    }

    .meeting-item-actions {
      display: flex;
      flex-shrink: 0;
      gap: 2px;
      margin-left: auto;
      opacity: 0;
      transition: opacity var(--quick) var(--ease);
    }

    .meeting-item:hover .meeting-item-actions,
    .meeting-item:focus-within .meeting-item-actions { opacity: 1; }

    .meeting-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      font-size: 12px;
      color: var(--text-dim);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease), color var(--quick) var(--ease);
    }

    .meeting-action:hover { color: var(--text); background: var(--bg-hover); }
    .meeting-action[data-action="delete"]:hover { color: var(--danger); }

    .meeting-item-meta {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-faint);
    }

    .meeting-item-participants {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .participant-tag {
      /* A name Meet got wrong can be a whole sentence, and one that cannot
         shrink widens the card and puts a scrollbar under the whole list. */
      max-width: 100%;
      overflow: hidden;
      padding: 1px 6px;
      font-size: 10px;
      color: var(--text-dim);
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .delete-confirm {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--danger);
    }

    .confirm-yes, .confirm-no {
      padding: 2px 8px;
      font-size: 11px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease), color var(--quick) var(--ease);
    }

    .confirm-yes:hover { color: var(--danger); background: var(--bg-hover); }
    .confirm-no:hover { color: var(--text); background: var(--bg-hover); }

    /* Detail view */
    .detail-entries .entry {
      margin-bottom: 4px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-entries .entry:last-child { border-bottom: none; }
    .speaker { margin-right: 6px; font-size: 10px; font-weight: 600; color: var(--text-dim); }
    .time { font-size: 10px; font-variant-numeric: tabular-nums; color: var(--text-faint); }
    .text { margin-top: 2px; line-height: 1.5; color: var(--text); word-break: break-word; }

    .footer {
      display: flex;
      justify-content: space-between;
      min-height: 28px;
      padding: 5px 12px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--bg-sunken);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .empty-state, .loading {
      padding: 40px 0;
      font-size: 12px;
      text-align: center;
      color: var(--text-faint);
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="btn-back" id="btn-back" style="display:none" title="Back">&larr;</button>
    <span class="header-title" id="header-title">Simple Transcript</span>
    <div class="header-actions" id="header-actions" style="display:none">
      <button class="btn-icon" id="detail-copy" title="Copy as Markdown">&#x2398;</button>
      <button class="btn-icon" id="detail-export" title="Download .md">&#x2193;</button>
    </div>
  </div>
  <div class="content" id="content">
    <div class="empty-state">Loading…</div>
  </div>
  <div class="footer" id="footer" style="display:none">
    <span id="footer-left"></span>
  </div>
  <script src="dist/popup.js"></script>
</body>
</html>
