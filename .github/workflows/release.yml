name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'specs/**'
      - '.specify/**'
      - '.claude/**'
      - 'assets/**'
      - 'docs/**'
      - 'store/**'
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto version and tag
        id: version
        uses: entech-code/auto-version-tagging-action@7615bc1048b4e526aa6403e39e38bc0dba86f981
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          majorVersion: 2
          tagPrefix: 'v'

  release:
    needs: version
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Set version in manifest
        run: |
          jq --arg v "${{ needs.version.outputs.version }}" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: |
          mkdir -p release
          zip -r "release/simple-transcript-${{ needs.version.outputs.version }}.zip" \
            manifest.json \
            popup.html \
            dist/ \
            icons/ \
            -x "*.map"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Simple Transcript ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release/simple-transcript-${{ needs.version.outputs.version }}.zip

  # The released version goes back into manifest.json on main, so a local build
  # shows the same number. Only once the release exists; a push made with
  # GITHUB_TOKEN does not start this workflow again.
  manifest-version:
    needs: [version, release]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Commit version to manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s/(\"version\": *\")[^\"]*\"/\1${VERSION}\"/" manifest.json
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Set manifest version to ${VERSION}"
          git push
